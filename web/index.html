<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f7f7f8;
            color: #1d1c23;
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 左侧边栏 ========== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: #f2f2f3;
            border-right: 1px solid #e8e8ea;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: width 0.3s ease, min-width 0.3s ease;
        }

        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            overflow: hidden;
            border-right: none;
        }

        .sidebar-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
        }

        .sidebar-logo {
            font-size: 18px;
            font-weight: 700;
            color: #1d1c23;
            letter-spacing: 1px;
        }

        .sidebar-toggle {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #8e8e93;
            transition: background 0.2s;
        }

        .sidebar-toggle:hover {
            background: #e8e8ea;
        }

        .new-chat-btn {
            margin: 4px 12px 12px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #e8e8ea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #1d1c23;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: #f7f7f8;
            border-color: #d8d8da;
        }

        .new-chat-btn .shortcut {
            margin-left: auto;
            font-size: 12px;
            color: #aeaeb2;
            background: #f2f2f3;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
        }

        .sidebar-menu::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-menu::-webkit-scrollbar-thumb {
            background: #d8d8da;
            border-radius: 2px;
        }

        .menu-item {
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #6e6e73;
            transition: background 0.15s;
            user-select: none;
        }

        .menu-item:hover {
            background: #e8e8ea;
        }

        .menu-item.active {
            background: #e8e8ea;
            color: #1d1c23;
            font-weight: 500;
        }

        .menu-item .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: #8e8e93;
        }

        .menu-item.active .icon {
            color: #1d1c23;
        }

        .tool-btn .icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        .sidebar-toggle svg {
            width: 20px;
            height: 20px;
        }

        .new-chat-btn svg {
            width: 18px;
            height: 18px;
        }

        .mode-selector svg {
            width: 14px;
            height: 14px;
        }

        .menu-divider {
            height: 1px;
            background: #e8e8ea;
            margin: 8px 12px;
        }

        .menu-section-title {
            padding: 12px 12px 6px;
            font-size: 12px;
            color: #aeaeb2;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 欢迎页面 */
        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .welcome-logo {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 12px;
            margin-bottom: 48px;
            color: #1d1c23;
            padding-left: 12px;
        }

        /* 输入框 */
        .input-wrapper {
            width: 100%;
            max-width: 680px;
        }

        .input-box {
            background: #fff;
            border: 1px solid #e8e8ea;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .input-box:focus-within {
            box-shadow: 0 4px 20px rgba(91, 106, 191, 0.08);
            border-color: #b8b9e8;
        }

        .input-textarea {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            resize: none;
            min-height: 24px;
            max-height: 160px;
            font-family: inherit;
            line-height: 1.6;
            color: #1d1c23;
        }

        .input-textarea::placeholder {
            color: #aeaeb2;
        }

        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .input-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: #f2f2f3;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6e6e73;
            transition: background 0.15s;
        }

        .action-btn:hover {
            background: #e8e8ea;
        }

        .input-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-selector {
            font-size: 13px;
            color: #8e8e93;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            user-select: none;
        }

        .mode-selector:hover {
            color: #6e6e73;
        }

        .send-btn {
            width: 34px;
            height: 34px;
            background: #d8d8da;
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .send-btn.active {
            background: #1d1c23;
        }

        .send-btn.active:hover {
            background: #3a3940;
            transform: scale(1.05);
        }

        .send-btn:not(.active) {
            cursor: default;
        }

        /* 快捷工具按钮 */
        .quick-tools {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tool-btn {
            padding: 7px 14px;
            background: #fff;
            border: 1px solid #e8e8ea;
            border-radius: 18px;
            cursor: pointer;
            font-size: 13px;
            color: #6e6e73;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            user-select: none;
        }

        .tool-btn:hover {
            background: #f7f7f8;
            border-color: #d8d8da;
            color: #1d1c23;
        }

        /* ========== 聊天消息区域 ========== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: none;
        }

        .chat-container.active {
            display: block;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #d8d8da;
            border-radius: 3px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            padding: 0 24px;
            position: relative;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 680px;
            padding: 0;
            line-height: 1.7;
            font-size: 15px;
        }

        .message.user .message-content {
            background: #f2f2f3;
            color: #1d1c23;
            padding: 10px 16px;
            border-radius: 12px;
            max-width: 70%;
        }

        .message.assistant .message-content {
            color: #1d1c23;
            max-width: 100%;
        }

        .message.assistant .message-content p {
            margin-bottom: 8px;
        }

        .message.assistant .message-content p:last-child {
            margin-bottom: 0;
        }

        .message.assistant code {
            background: #f2f2f3;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 13px;
        }

        .message.assistant pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.assistant pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .message.assistant h1,
        .message.assistant h2,
        .message.assistant h3 {
            margin: 16px 0 8px;
            font-weight: 600;
        }

        .message.assistant h1 {
            font-size: 20px;
        }

        .message.assistant h2 {
            font-size: 17px;
        }

        .message.assistant h3 {
            font-size: 15px;
        }

        .message.assistant ul,
        .message.assistant ol {
            padding-left: 24px;
            margin: 8px 0;
        }

        .message.assistant li {
            margin-bottom: 4px;
        }

        .message.assistant blockquote {
            border-left: 3px solid #d8d8da;
            padding-left: 12px;
            margin: 8px 0;
            color: #6e6e73;
        }

        .message.assistant table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
        }

        .message.assistant th,
        .message.assistant td {
            border: 1px solid #e8e8ea;
            padding: 6px 12px;
            text-align: left;
        }

        .message.assistant th {
            background: #f7f7f8;
            font-weight: 600;
        }

        /* 消息操作按钮 */
        .message-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            position: absolute;
            bottom: -28px;
        }

        .message.assistant .message-actions {
            left: 24px;
        }

        .message.user .message-actions {
            right: 24px;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .msg-action-btn {
            width: 26px;
            height: 26px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aeaeb2;
            transition: all 0.15s;
        }

        .msg-action-btn:hover {
            background: #e8e8ea;
            color: #6e6e73;
        }

        .msg-action-btn svg {
            width: 14px;
            height: 14px;
        }

        /* 模型标识 */
        .model-badge {
            font-size: 12px;
            color: #aeaeb2;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .model-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #5b6abf;
        }

        /* 加载动画 */
        .loading-dots {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            padding: 4px 0;
        }

        .loading-dots span {
            width: 7px;
            height: 7px;
            background: #aeaeb2;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* 底部输入框（聊天时） */
        .chat-input-bar {
            padding: 12px 24px 20px;
            flex-shrink: 0;
            display: none;
        }

        .chat-input-bar.active {
            display: block;
        }

        .chat-input-bar .input-box {
            max-width: 680px;
            margin: 0 auto;
        }

        /* 复制成功提示 */
        .copy-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1d1c23;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .copy-toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">Iris</div>
            <button class="sidebar-toggle" onclick="toggleSidebar()" title="收起侧边栏">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
        </div>

        <button class="new-chat-btn" onclick="resetChat()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span>新建会话</span>
            <span class="shortcut">Ctrl K</span>
        </button>

        <nav class="sidebar-menu">
            <div class="menu-item active">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                <span>我的 Iris</span>
            </div>
            <div class="menu-item">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                <span>定时任务</span>
            </div>

            <div class="menu-divider"></div>
            <div class="menu-section-title">对话</div>
            <div class="menu-item">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
                </svg>
                <span>今天的对话</span>
            </div>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 欢迎页面 -->
        <div class="welcome-container" id="welcome-container">
            <div class="welcome-logo">IRIS</div>

            <div class="input-wrapper">
                <div class="input-box">
                    <textarea class="input-textarea" id="chat-input" placeholder="输入 '/' 唤起插件和技能" rows="1"
                        oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-footer">
                        <div class="input-actions">
                            <button class="action-btn" title="添加">+</button>
                        </div>
                        <div class="input-right">
                            <span class="mode-selector">
                                快速 进阶
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                </svg>
                            </span>
                            <button class="send-btn" onclick="sendMessage()" title="发送">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 聊天消息区域 -->
        <div class="chat-container" id="chat-container"></div>

        <!-- 底部输入框（聊天时显示） -->
        <div class="chat-input-bar" id="chat-input-bar">
            <div class="input-box">
                <textarea class="input-textarea" id="chat-input-2" placeholder="输入消息..." rows="1"
                    oninput="autoResize(this)" onkeydown="handleKeyPress2(event)"></textarea>
                <div class="input-footer">
                    <div class="input-actions">
                        <button class="action-btn" title="添加">+</button>
                    </div>
                    <div class="input-right">
                        <span class="mode-selector">
                            快速 进阶
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                            </svg>
                        </span>
                        <button class="send-btn" onclick="sendMessage2()" title="发送">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 复制成功提示 -->
    <div class="copy-toast" id="copy-toast">已复制</div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let hasMessages = false;
        let sidebarCollapsed = false;
        let isGenerating = false;
        const API_BASE = 'http://localhost:8000';

        // Ctrl+K 快捷键
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                resetChat();
            }
        });

        // 页面加载时恢复历史消息
        window.addEventListener('load', loadHistory);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebarCollapsed = !sidebarCollapsed;
            sidebar.classList.toggle('collapsed', sidebarCollapsed);
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
            updateSendBtn(el);
        }

        function updateSendBtn(el) {
            const sendBtn = el.closest('.input-box').querySelector('.send-btn');
            if (el.value.trim()) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        }

        function quickAction(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleKeyPress2(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage2();
            }
        }

        function switchToChatMode() {
            if (!hasMessages) {
                document.getElementById('welcome-container').style.display = 'none';
                document.getElementById('chat-container').classList.add('active');
                document.getElementById('chat-input-bar').classList.add('active');
                hasMessages = true;
            }
        }

        function getActiveInput() {
            return hasMessages
                ? document.getElementById('chat-input-2')
                : document.getElementById('chat-input');
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || isGenerating) return;
            switchToChatMode();
            await sendAndStream(message, input);
        }

        async function sendMessage2() {
            const input = document.getElementById('chat-input-2');
            const message = input.value.trim();
            if (!message || isGenerating) return;
            await sendAndStream(message, input);
        }

        async function sendAndStream(message, input) {
            isGenerating = true;

            // 添加用户消息
            appendUserMessage(message);
            input.value = '';
            input.style.height = 'auto';
            updateSendBtn(input);

            // 添加加载动画
            const loadingId = 'loading-' + Date.now();
            appendLoadingMessage(loadingId);

            try {
                const response = await fetch(`${API_BASE}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                const msgEl = document.getElementById(loadingId);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const lines = decoder.decode(value, { stream: true }).split('\n');
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            if (data.content) {
                                fullText += data.content;
                                msgEl.innerHTML = `
                                    <div class="model-badge"><span class="dot"></span> Iris Agent</div>
                                    <div class="message-content">${marked.parse(fullText)}</div>
                                    ${buildMessageActions(fullText)}`;
                                scrollToBottom();
                            }
                            if (data.error) {
                                msgEl.innerHTML = `
                                    <div class="message-content">出错了：${escapeHtml(data.error)}</div>`;
                            }
                        } catch (e) {
                            // 忽略解析错误
                        }
                    }
                }

                // 最终渲染
                if (fullText) {
                    msgEl.innerHTML = `
                        <div class="model-badge"><span class="dot"></span> Iris Agent</div>
                        <div class="message-content">${marked.parse(fullText)}</div>
                        ${buildMessageActions(fullText)}`;
                }
            } catch (error) {
                const msgEl = document.getElementById(loadingId);
                msgEl.innerHTML = `
                    <div class="message-content">发送失败，请检查后端服务是否启动</div>`;
            }

            isGenerating = false;
            scrollToBottom();
        }

        function appendUserMessage(text) {
            const chatContainer = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="message-content">${escapeHtml(text)}</div>
                <div class="message-actions">
                    <button class="msg-action-btn" onclick="copyMessage(this)" title="复制">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                        </svg>
                    </button>
                </div>`;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function appendLoadingMessage(id) {
            const chatContainer = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = id;
            div.innerHTML = `
                <div class="message-content">
                    <div class="loading-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>`;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function buildMessageActions(text) {
            return `
                <div class="message-actions">
                    <button class="msg-action-btn" onclick="copyMessage(this)" title="复制">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                        </svg>
                    </button>
                    <button class="msg-action-btn" onclick="regenerateMessage(this)" title="重新生成">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.992 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" />
                        </svg>
                    </button>
                </div>`;
        }

        function copyMessage(btn) {
            const msgEl = btn.closest('.message').querySelector('.message-content');
            const text = msgEl.innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制');
            });
        }

        async function regenerateMessage(btn) {
            if (isGenerating) return;
            const msgEl = btn.closest('.message');
            const messages = msgEl.parentElement.querySelectorAll('.message');
            let userText = '';
            // 找到前一个用户消息
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].classList.contains('user')) {
                    userText = messages[i].querySelector('.message-content').innerText;
                    break;
                }
            }
            if (!userText) return;

            // 移除当前助手消息
            msgEl.remove();

            // 重新发送
            isGenerating = true;
            const loadingId = 'regen-' + Date.now();
            appendLoadingMessage(loadingId);

            try {
                const response = await fetch(`${API_BASE}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                const newMsgEl = document.getElementById(loadingId);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const lines = decoder.decode(value, { stream: true }).split('\n');
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            if (data.content) {
                                fullText += data.content;
                                newMsgEl.innerHTML = `
                                    <div class="model-badge"><span class="dot"></span> Iris Agent</div>
                                    <div class="message-content">${marked.parse(fullText)}</div>
                                    ${buildMessageActions(fullText)}`;
                                scrollToBottom();
                            }
                        } catch (e) { }
                    }
                }

                if (fullText) {
                    newMsgEl.innerHTML = `
                        <div class="model-badge"><span class="dot"></span> Iris Agent</div>
                        <div class="message-content">${marked.parse(fullText)}</div>
                        ${buildMessageActions(fullText)}`;
                }
            } catch (error) {
                const newMsgEl = document.getElementById(loadingId);
                newMsgEl.innerHTML = `<div class="message-content">重新生成失败，请重试</div>`;
            }

            isGenerating = false;
            scrollToBottom();
        }

        function showToast(text) {
            const toast = document.getElementById('copy-toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        function scrollToBottom() {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/api/history`);
                const data = await response.json();
                if (data.messages && data.messages.length > 0) {
                    switchToChatMode();
                    for (const msg of data.messages) {
                        if (msg.role === 'user') {
                            appendUserMessage(msg.content);
                        } else if (msg.role === 'assistant') {
                            const chatContainer = document.getElementById('chat-container');
                            const div = document.createElement('div');
                            div.className = 'message assistant';
                            div.innerHTML = `
                                <div class="model-badge"><span class="dot"></span> Iris Agent</div>
                                <div class="message-content">${marked.parse(msg.content)}</div>
                                ${buildMessageActions(msg.content)}`;
                            chatContainer.appendChild(div);
                        }
                    }
                    scrollToBottom();
                }
            } catch (error) {
                // 后端未启动时静默处理
            }
        }

        async function resetChat() {
            if (hasMessages && !confirm('确定要新建会话吗？')) return;

            try {
                await fetch(`${API_BASE}/api/chat/reset`, { method: 'POST' });
            } catch (e) { }

            const welcomeContainer = document.getElementById('welcome-container');
            const chatContainer = document.getElementById('chat-container');
            const chatInputBar = document.getElementById('chat-input-bar');

            chatContainer.innerHTML = '';
            chatContainer.classList.remove('active');
            chatInputBar.classList.remove('active');
            welcomeContainer.style.display = 'flex';
            hasMessages = false;
            isGenerating = false;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
