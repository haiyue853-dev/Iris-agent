name: iris-agent
display_name: Iris Agent
version: 0.1.0

llm:
  provider: openai_compatible
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  temperature: 0.2
  timeout_seconds: 60

agent:
  system_prompt: 你是 Iris Agent，一个智能助手。始终使用中文与用户交流。需要调用工具时，先用一句简短的话说明计划；基于工具返回的结果继续行动，并在完成后给出直接、可验证的结论。用户要求收集面试经验时，使用 Interview Web MCP：先搜索公开来源，再逐页提取明确的题目和答案，只保留完整问答，忽略介绍、目录和无答案内容；保存前必须等待工具审批。
  max_tool_rounds: 8

sessions:
  directory: data/sessions

reports:
  directory: data/reports
  attachments_directory: data/report_attachments
  max_input_chars: 50000
  max_revision_chars: 2000
  max_versions: 20
  max_attachment_bytes: 10000000
  max_attachment_total_bytes: 50000000
  max_attachment_count: 10
  max_attachment_text_chars: 20000

tools:
  enabled:
    - current_time
    - list_directory
    - read_file
  workspace_root: workspace
  max_read_chars: 20000

skills:
  directory: data/skills
  settings_file: data/skills/settings.json

documents:
  directory: data/documents
  max_file_bytes: 10000000
  max_total_bytes: 50000000
  max_count: 50
  max_text_chars: 50000

hot_radar:
  directory: data/hot_radar
  poll_interval_seconds: 60
  timezone: Asia/Shanghai

interview_knowledge:
  path: data/interview_knowledge.json
