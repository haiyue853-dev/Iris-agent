name: iris-agent
display_name: Iris Agent
version: 0.1.0

llm:
  provider: openai_compatible
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  temperature: 0.2
  timeout_seconds: 60

agent:
  system_prompt: |
    你是 Iris Agent，一个智能助手。始终使用中文与用户交流。
    当你抓取或检索「面试经验、面经、面试题、教程、技术干货」类网页内容后，要把内容整理成「问题 + 答案」的清晰结构输出，规则：
    1. 每个问题单独列出，紧跟该问题的具体答案（满分回答、正确做法、完整步骤），不要用「考点」「踩坑点」这类概括代替具体答案。
    2. 原文如果先给总结/考点、再给具体答案，两者都保留：先列总结，再列具体答案。
    3. 原文如果只有简单答案，就直接提取那个简单答案。
    4. 答案要完整具体，保留关键细节和步骤，不要压缩成一句话。
    当你调用工具（搜索、抓取网页等）失败时，先读错误信息，然后换一种方式重试：换关键词、换 URL、或换一个工具，不要因为一次失败就直接放弃。
    当你需要基于用户的知识库回答问题时，先用 search_knowledge 工具检索知识库，再基于检索结果回答；当用户要求「收集、保存面经/面试经验到知识库」时，用 add_knowledge 工具保存（标题 + 完整正文）。
  max_tool_rounds: 8

sessions:
  directory: data/sessions

reports:
  directory: data/reports
  attachments_directory: data/report_attachments
  max_input_chars: 50000
  max_revision_chars: 2000
  max_versions: 20
  max_attachment_bytes: 10000000
  max_attachment_total_bytes: 50000000
  max_attachment_count: 10
  max_attachment_text_chars: 20000

tools:
  enabled:
    - current_time
    - list_directory
    - read_file
  workspace_root: workspace
  max_read_chars: 20000

skills:
  directory: data/skills
  settings_file: data/skills/settings.json
  user_directory: data/skills/user
  max_body_chars: 4000

hot_radar:
  directory: data/hot_radar
  poll_interval_seconds: 60
  timezone: Asia/Shanghai

automation:
  directory: data/automation

notifications:
  directory: data/notifications

task_queue:
  directory: data/task_queue

memory:
  directory: data/memory
  max_entries: 500
  max_chars: 500
  max_injected_chars: 2000
  max_injected_entries: 20

session_search:
  max_hit_chars: 300
  default_limit: 5

subagent:
  max_goal_chars: 2000
  max_context_chars: 4000
  max_result_chars: 4000
  default_max_rounds: 6
  allowed_tools: current_time,list_directory,read_file,recall,use_skill

profile:
  directory: data/profile
  max_items_per_field: 20
  max_item_chars: 200
  extract_interval_rounds: 10
  enabled: true

context:
  trigger_chars: 12000
  keep_recent: 10
  max_summary_chars: 2000
  enabled: true

web_search:
  enabled: true
  timeout_seconds: 15
  max_results: 5
  max_snippet_chars: 300
  max_page_chars: 30000
  max_retries: 2
  enable_duckduckgo: false
  enable_browser_fallback: false
  browser_channel: msedge
  min_text_chars: 200

knowledge:
  directory: data/knowledge
  max_content_chars: 50000
  max_hit_chars: 500
  default_limit: 5

