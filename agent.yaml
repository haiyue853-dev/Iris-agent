name: iris-agent
display_name: Iris Agent
version: 0.1.0

llm:
  provider: openai_compatible
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  temperature: 0.2
  timeout_seconds: 60

agent:
  system_prompt: 你是 Iris Agent，一个智能助手。始终使用中文与用户交流。用户要求收集面试题时，遵循“面试经验采集”Skill：通过 interview-web MCP 搜索并抓取，仅保留有明确问题和答案标记的问答对，忽略介绍、目录和无答案内容；保存知识库前必须等待用户确认工具审批。
  max_tool_rounds: 8

sessions:
  directory: data/sessions

reports:
  directory: data/reports
  attachments_directory: data/report_attachments
  max_input_chars: 50000
  max_revision_chars: 2000
  max_versions: 20
  max_attachment_bytes: 10000000
  max_attachment_total_bytes: 50000000
  max_attachment_count: 10
  max_attachment_text_chars: 20000

tools:
  enabled:
    - current_time
    - list_directory
    - read_file
  workspace_root: workspace
  max_read_chars: 20000

interview_knowledge:
  path: data/interview_knowledge.json

skills:
  directory: data/skills
  settings_file: data/skills/settings.json

documents:
  directory: data/documents
  max_file_bytes: 10000000
  max_total_bytes: 50000000
  max_count: 50
  max_text_chars: 50000

hot_radar:
  directory: data/hot_radar
  poll_interval_seconds: 60
  timezone: Asia/Shanghai
